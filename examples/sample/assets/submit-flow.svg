<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img"><title>需求提交分支与恢复</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#17243a;font-size:16px} .edge{fill:none;stroke:#52647a;stroke-width:2} .label{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52647a"/></marker></defs><text x="24" y="32" font-size="21" font-weight="600">需求提交分支与恢复</text><path class="edge" d="M 400 150 L 400 210" marker-end="url(#arrow)"/><path class="edge" d="M 400 290 L 400 350" marker-end="url(#arrow)"/><path class="edge" d="M 275 390 L 72 390 L 72 690 L 275 690" marker-end="url(#arrow)"/><text class="label" x="79" y="540" text-anchor="start">完整且保存成功</text><path class="edge" d="M 525 390 C 575 390, 575 390, 625 390" marker-end="url(#arrow)"/><text class="label" x="575" y="382" text-anchor="middle">不完整</text><path class="edge" d="M 875 390 L 1043 390 L 1043 110 L 525 110" marker-end="url(#arrow)"/><text class="label" x="1035" y="372" text-anchor="end">补齐后</text><path class="edge" d="M 525 390 C 575 390, 575 550, 625 550" marker-end="url(#arrow)"/><text class="label" x="575" y="462" text-anchor="middle">完整但保存</text><text class="label" x="575" y="482" text-anchor="middle">失败</text><path class="edge" d="M 875 550 L 1065 550 L 1065 250 L 525 250" marker-end="url(#arrow)"/><text class="label" x="1057" y="532" text-anchor="end">保留输入重试</text><rect x="275" y="70" width="250" height="80" rx="10" fill="#edf4fd" stroke="#516d96"/><text x="400" y="115" text-anchor="middle">填写需求</text><rect x="275" y="210" width="250" height="80" rx="10" fill="#edf4fd" stroke="#516d96"/><text x="400" y="255" text-anchor="middle">提交申请</text><polygon points="400,347 525,390 400,433 275,390" fill="#fff4d7" stroke="#957038"/><text x="400" y="395" text-anchor="middle">信息完整</text><rect x="275" y="650" width="250" height="80" rx="30" fill="#edf4fd" stroke="#516d96"/><text x="400" y="695" text-anchor="middle">进入待处理</text><rect x="625" y="350" width="250" height="80" rx="10" fill="#edf4fd" stroke="#516d96"/><text x="750" y="395" text-anchor="middle">返回补充</text><rect x="625" y="510" width="250" height="80" rx="10" fill="#edf4fd" stroke="#516d96"/><text x="750" y="555" text-anchor="middle">保存失败</text></svg>